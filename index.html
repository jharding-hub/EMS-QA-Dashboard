function filterByPeriod(inc, period) {
  if (period === "yesterday") return inc.filter(i => i.date === "2026-05-11");
  const cutoff = period === "week" ? "2026-05-05" : "2026-04-12";
  return inc.filter(i => i.date >= cutoff && i.date <= "2026-05-11");
}
const SC  = s => ({ red:"#ff4757", yellow:"#ffb700", green:"#1fda73" }[s]);
const SBG = s => ({ red:"var(--red-bg)", yellow:"var(--amber-bg)", green:"var(--green-bg)" }[s]);
const SBD = s => ({ red:"var(--red-brd)", yellow:"var(--amber-brd)", green:"var(--green-brd)" }[s]);
const cnt = arr => ({ total:arr.length, red:arr.filter(i=>i.status==="red").length, yellow:arr.filter(i=>i.status==="yellow").length, green:arr.filter(i=>i.status==="green").length });

const PERIOD_LABEL = { yesterday:"Yesterday (May 11, 2026)", week:"Last 7 Days (May 5–11)", month:"Last 30 Days (Apr 12 – May 11)" };

const AI_SYSTEM = `You are an EMS Quality Assurance specialist reviewing a patient care report (PCR) for Fishers Department of Fire and Emergency Services against the Indianapolis Metropolitan Area EMS Protocols 2026 (Marion County EMS Protocols, Version 25.11.1).

Respond with ONLY valid JSON — no markdown fences, no preamble:
{
  "status": "RED" | "YELLOW" | "GREEN",
  "summary": "1–2 sentence overall QA assessment",
  "flags": ["specific issue with protocol reference where applicable"],
  "protocolScore": 1-10,
  "narrativeScore": 1-10,
  "recommendations": ["specific, actionable improvement"]
}

STATUS CRITERIA:
RED — Serious protocol violations or patient safety concerns:
  • Advanced airway (ETT/King/i-gel) without waveform capnography (Verification of ETT and Supraglottic Airway Device Placement protocol)
  • Cardiac arrest: CPR quality metrics absent, TOR criteria not assessed, post-ROSC care undocumented (Adult Cardiac Arrest General Care, Post Cardiac Arrest Care protocols)
  • STEMI: cath lab activation undocumented, aspirin absent per ACS protocol, 12-lead transmission missing (STEMI Special Care protocol)
  • Stroke: Last Known Well absent, Cincinnati/BEFAST incomplete (Stroke CVA protocol)
  • Major trauma: tourniquet time missing, hemorrhage control steps absent, spinal motion restriction rationale absent (Initial Trauma Care, Spinal Clearing protocols)
  • MCI: START triage undocumented, ICS roles absent (MCI SOG)
  • Medication administered without route, dose, or response documented

YELLOW — Documentation/quality issues:
  • Poor narrative quality (< 3 descriptive sentences, vague, generic)
  • Incomplete SAMPLE/OPQRST history
  • Only one set of vitals documented on non-transport or extended scene
  • Pain reassessment absent after intervention
  • Pediatric weight in pounds instead of kg
  • Orthostatic vitals absent for syncope/near-syncope

GREEN — Compliant report:
  • Protocol adherence documented, good narrative, vitals trended, interventions and responses charted

Be specific about protocol section names when flagging issues.`;

function Badge({ status, size = "sm" }) {
  const isLg = size === "lg";
  return (
    <span style={{ display:"inline-block", fontFamily:"var(--mono)", fontWeight:600, letterSpacing:"0.07em", borderRadius:4, background:SBG(status), color:SC(status), border:`1px solid ${SBD(status)}`, fontSize:isLg?12:10, padding:isLg?"4px 12px":"2px 7px", whiteSpace:"nowrap" }}>
      {status.toUpperCase()}
    </span>
  );
}

function IncidentTable({ incidents, onSelect }) {
  if (!incidents.length) return (
    <div style={{ padding:40, textAlign:"center", color:"var(--text3)", fontFamily:"var(--mono)", fontSize:13 }}>No incidents in this period</div>
  );
  return (
    <div style={{ overflowX:"auto" }}>
      <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
        <thead>
          <tr style={{ background:"var(--surface2)", fontSize:10, textTransform:"uppercase", letterSpacing:"0.08em", color:"var(--text2)" }}>
            {["Status","Incident #","Date · Time","Chief Complaint","Unit","Sh","Issues"].map(h => (
              <th key={h} style={{ padding:"9px 12px", textAlign:"left", fontWeight:700, borderBottom:"1px solid var(--border2)", whiteSpace:"nowrap" }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {incidents.map(i => (
            <tr key={i.id} className="inc-row fade-in" onClick={() => onSelect(i)} style={{ borderBottom:"1px solid var(--border)", background:"transparent" }}>
              <td style={{ padding:"9px 12px" }}><Badge status={i.status} /></td>
              <td style={{ padding:"9px 12px", fontFamily:"var(--mono)", fontSize:11, color:"var(--blue)", whiteSpace:"nowrap" }}>{i.num}</td>
              <td style={{ padding:"9px 12px", fontFamily:"var(--mono)", fontSize:11, whiteSpace:"nowrap" }}>{i.date.slice(5)} {i.time}</td>
              <td style={{ padding:"9px 12px" }}>{i.complaint}</td>
              <td style={{ padding:"9px 12px", fontFamily:"var(--mono)", fontSize:11 }}>{i.unit}</td>
              <td style={{ padding:"9px 12px", textAlign:"center" }}>
                <span style={{ fontFamily:"var(--mono)", fontSize:11, background:"var(--surface3)", padding:"2px 6px", borderRadius:3 }}>{i.shift}</span>
              </td>
              <td style={{ padding:"9px 12px" }}>
                {i.flags.length
                  ? <span style={{ background:SBG(i.status), color:SC(i.status), border:`1px solid ${SBD(i.status)}`, borderRadius:4, padding:"1px 8px", fontSize:11, fontFamily:"var(--mono)" }}>{i.flags.length} flag{i.flags.length>1?"s":""}</span>
                  : <span style={{ color:"var(--green)", fontSize:11, fontFamily:"var(--mono)" }}>✓ None</span>}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function IncidentDetail({ incident: i, onBack, showBack = true }) {
  return (
    <div className="fade-in" style={{ padding:24 }}>
      {showBack && (
        <button className="qa-btn" onClick={onBack} style={{ marginBottom:20, background:"var(--surface2)", color:"var(--text2)", padding:"6px 14px", borderRadius:6, fontSize:13, border:"1px solid var(--border2)", fontWeight:600 }}>
          ← Back to list
        </button>
      )}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
        {[
          ["Incident #", i.num, true],
          ["Date / Time", `${i.date}  ${i.time}`, true],
          ["Chief Complaint", i.complaint, false],
          ["Unit", i.unit, true],
          ["Shift", i.shift, true],
          ["Age", i.age > 0 ? `${i.age} yrs` : "Multi-patient", false],
          ["Category", i.cat, false],
          ["Disposition", i.disp, false],
        ].map(([label, val, mono]) => (
          <div key={label} style={{ background:"var(--surface2)", borderRadius:8, padding:"12px 14px", border:"1px solid var(--border)" }}>
            <div style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.1em", color:"var(--text3)", marginBottom:5, fontWeight:700 }}>{label}</div>
            <div style={{ fontSize:13, color:"var(--text)", fontFamily:mono?"var(--mono)":"inherit", wordBreak:"break-word" }}>{val}</div>
          </div>
        ))}
      </div>

      <div style={{ background:"var(--surface2)", borderRadius:8, padding:"12px 14px", border:"1px solid var(--border)", marginBottom:12 }}>
        <div style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.1em", color:"var(--text3)", marginBottom:8, fontWeight:700 }}>Crew</div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
          {i.providers.map(p => (
            <span key={p} style={{ background:"var(--blue-bg)", color:"var(--blue)", border:"1px solid var(--blue-brd)", borderRadius:4, padding:"3px 10px", fontSize:12, fontFamily:"var(--mono)" }}>{p}</span>
          ))}
        </div>
      </div>

      <div style={{ background:"var(--surface2)", borderRadius:8, padding:"14px 16px", border:`1px solid ${SBD(i.status)}` }}>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
          <Badge status={i.status} size="lg" />
          <span style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.12em", color:"var(--text3)", fontWeight:700 }}>QA Assessment</span>
        </div>
        {i.flags.length === 0
          ? <div style={{ color:"var(--green)", fontSize:14 }}>✓ No QA issues identified — report meets documentation standards.</div>
          : <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {i.flags.map((f, idx) => (
                <div key={idx} style={{ display:"flex", gap:10, alignItems:"flex-start" }}>

// View types: 'list' | 'shift' | 'provider' | 'unit'
function IncidentModal({ title, subtitle, incidents, view = "list", initialIncident = null, onClose }) {
  const [selected, setSelected] = useState(initialIncident);

  let body;
  if (selected) {
    body = <IncidentDetail incident={selected} onBack={() => setSelected(null)} />;
  } else if (view === "shift") {
    body = <ShiftBreakdown incidents={incidents} onSelect={setSelected} />;
  } else if (view === "provider") {
    body = <ProviderTable incidents={incidents} />;
  } else if (view === "unit") {
    body = <UnitTable incidents={incidents} />;
  } else {
    body = <IncidentTable incidents={incidents} onSelect={setSelected} />;
  }

  return (
    <div className="modal-bg" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-box fade-in">
        <div style={{ padding:"18px 22px", borderBottom:"1px solid var(--border2)", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
          <div>
            <div style={{ fontWeight:800, fontSize:16, letterSpacing:"0.03em" }}>{title}</div>
            {subtitle && <div style={{ fontSize:12, color:"var(--text2)", marginTop:2 }}>{subtitle}</div>}
          </div>
          <button className="qa-btn" onClick={onClose} style={{ background:"var(--surface2)", color:"var(--text2)", width:32, height:32, borderRadius:6, fontSize:16, border:"1px solid var(--border2)", display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
        </div>
        <div style={{ overflowY:"auto", flexGrow:1 }}>{body}</div>
      </div>
    </div>
  );
}

    </div>
  );
}

function ProviderTable({ incidents }) {
  const map = {};
  incidents.forEach(i => {
    i.providers.forEach(p => {
      if (!map[p]) map[p] = { name:p, total:0, red:0, yellow:0, green:0 };
      map[p].total++; map[p][i.status]++;
    });
  });
  const rows = Object.values(map).sort((a,b) => b.red-a.red || b.total-a.total);
  return (
    <div style={{ padding:20 }}>
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
          <thead>
            <tr style={{ background:"var(--surface2)", fontSize:10, textTransform:"uppercase", letterSpacing:"0.08em", color:"var(--text2)" }}>
              {["Provider","Total","Critical","Review","Compliant","Compliance %"].map(h => (
                <th key={h} style={{ padding:"9px 12px", textAlign:h==="Provider"?"left":"center", fontWeight:700, borderBottom:"1px solid var(--border2)" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(r => {
              const pct = r.total>0 ? Math.round((r.green/r.total)*100) : 0;
              return (
                <tr key={r.name} style={{ borderBottom:"1px solid var(--border)" }}>
                  <td style={{ padding:"9px 12px", fontFamily:"var(--mono)", fontSize:12 }}>{r.name}</td>
                  <td style={{ padding:"9px 12px", textAlign:"center", fontFamily:"var(--mono)" }}>{r.total}</td>
                  <td style={{ padding:"9px 12px", textAlign:"center", fontFamily:"var(--mono)", color:r.red?"#ff4757":"var(--text3)", fontWeight:r.red?700:400 }}>{r.red}</td>
                  <td style={{ padding:"9px 12px", textAlign:"center", fontFamily:"var(--mono)", color:r.yellow?"#ffb700":"var(--text3)" }}>{r.yellow}</td>
                  <td style={{ padding:"9px 12px", textAlign:"center", fontFamily:"var(--mono)", color:r.green?"#1fda73":"var(--text3)" }}>{r.green}</td>
                  <td style={{ padding:"9px 12px", textAlign:"center" }}>
                    <span style={{ fontFamily:"var(--mono)", fontWeight:700, color:pct>=80?"#1fda73":pct>=60?"#ffb700":"#ff4757" }}>{pct}%</span>

        Showing providers with documented runs in this period. Connect to ESO API / Firestore to display all 160 personnel including those with zero runs.
      </div>
    </div>
  );
}

function UnitTable({ incidents }) {

function AIEvalPanel({ onClose }) {
  const [input, setInput]   = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult]   = useState(null);
  const [error, setError]     = useState("");

  async function evaluate() {
    if (!input.trim()) return;
    setLoading(true); setError(""); setResult(null);
    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:1000,
          system: AI_SYSTEM,
          messages:[{ role:"user", content:`Evaluate this PCR:\n\n${input}` }]
        })
      });
      const data = await resp.json();
      const text = (data.content||[]).map(c=>c.text||"").join("");
      const clean = text.replace(/```json|```/g,"").trim();
      setResult(JSON.parse(clean));
    } catch(e) {
      setError("Evaluation failed. Verify API connectivity and try again.");
    } finally { setLoading(false); }
  }

  return (
    <div className="modal-bg" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-box fade-in" style={{ maxWidth:680 }}>
        <div style={{ padding:"18px 22px", borderBottom:"1px solid var(--border2)", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
          <div>
            <div style={{ fontWeight:800, fontSize:16, letterSpacing:"0.03em" }}>◈ AI PCR Evaluator</div>
            <div style={{ fontSize:12, color:"var(--text2)", marginTop:2 }}>Marion County EMS Protocols 2026 · Fishers DFE&S</div>
          </div>
          <button className="qa-btn" onClick={onClose} style={{ background:"var(--surface2)", color:"var(--text2)", width:32, height:32, borderRadius:6, fontSize:16, border:"1px solid var(--border2)", display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
        </div>
        <div style={{ overflowY:"auto", flexGrow:1, padding:22 }}>
          <label style={{ display:"block", fontSize:11, textTransform:"uppercase", letterSpacing:"0.1em", color:"var(--text2)", marginBottom:8, fontWeight:700 }}>Paste PCR Narrative / Report Data</label>
          <textarea
            value={input}
            onChange={e=>setInput(e.target.value)}
            placeholder={"Paste the PCR narrative, chief complaint, vitals, interventions performed, medications administered, and any relevant documentation...\n\nExample: 64yo male, CP 8/10 radiating to jaw, diaphoretic. 12-lead showed STEMI inferior. Aspirin 324mg PO given. IV established 18ga R AC. NTG 0.4mg SL x1 — BP 100/72 post-NTG, held further doses. Transported L&S IU North, cath team notified by radio..."}
            style={{ width:"100%", background:"var(--surface2)", border:"1px solid var(--border2)", borderRadius:8, padding:"12px 14px", color:"var(--text)", minHeight:160, fontSize:12 }}
          />
          <button className="qa-btn" onClick={evaluate} disabled={loading||!input.trim()} style={{ marginTop:12, background:loading||!input.trim()?"var(--surface3)":"var(--blue)", color:loading||!input.trim()?"var(--text3)":"#fff", padding:"11px 24px", borderRadius:8, fontSize:14, fontWeight:800, letterSpacing:"0.06em", width:"100%", border:"none" }}>
            {loading ? "⟳  Evaluating against protocols..." : "▶  Run QA Evaluation"}
          </button>
          {error && <div style={{ marginTop:12, padding:"10px 14px", background:"var(--red-bg)", border:"1px solid var(--red-brd)", borderRadius:6, color:"#ff4757", fontSize:13 }}>{error}</div>}
          {result && (
            <div className="fade-in" style={{ marginTop:20 }}>
              <div style={{ display:"flex", alignItems:"flex-start", gap:12, marginBottom:14, padding:"14px 16px", background:SBG(result.status.toLowerCase()), border:`1px solid ${SBD(result.status.toLowerCase())}`, borderRadius:8 }}>
                <Badge status={result.status.toLowerCase()} size="lg" />
                <p style={{ fontSize:13, color:"var(--text)", lineHeight:1.6, margin:0 }}>{result.summary}</p>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14 }}>
                {[["Protocol Compliance", result.protocolScore],["Narrative Quality", result.narrativeScore]].map(([lbl, score]) => (
                  <div key={lbl} style={{ background:"var(--surface2)", borderRadius:8, padding:"14px", border:"1px solid var(--border)", textAlign:"center" }}>
                    <div style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.1em", color:"var(--text3)", marginBottom:6, fontWeight:700 }}>{lbl}</div>
                    <div style={{ fontFamily:"var(--mono)", fontSize:30, fontWeight:700, color:score>=8?"#1fda73":score>=6?"#ffb700":"#ff4757", lineHeight:1 }}>{score}<span style={{ fontSize:14, color:"var(--text3)" }}>/10</span></div>
                  </div>
                ))}
              </div>
              {result.flags?.length>0 && (
                <div style={{ background:"var(--surface2)", borderRadius:8, padding:"14px 16px", border:"1px solid var(--red-brd)", marginBottom:12 }}>
                  <div style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.1em", color:"#ff4757", marginBottom:10, fontWeight:700 }}>Issues Identified</div>
                  {result.flags.map((f,i) => (
                    <div key={i} style={{ display:"flex", gap:8, marginBottom:7 }}>
                      <span style={{ color:"#ff4757", flexShrink:0 }}>▸</span>

                    </div>
                  ))}
                </div>

                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            <div className="blink" style={{ width:8, height:8, borderRadius:"50%", background:"var(--green)", flexShrink:0 }} />
            <div>
              <div style={{ fontWeight:900, fontSize:15, letterSpacing:"0.06em", textTransform:"uppercase" }}>Fishers Dept. of Fire &amp; Emergency Services</div>
              <div style={{ fontFamily:"var(--mono)", fontSize:10, color:"var(--text3)", letterSpacing:"0.1em", marginTop:1 }}>EMS QA/QI INTELLIGENCE DASHBOARD · {PERIOD_LABEL[period]}</div>
            </div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ display:"flex", background:"var(--surface2)", borderRadius:8, border:"1px solid var(--border)", overflow:"hidden" }}>
              {[["yesterday","Yesterday"],["week","7 Days"],["month","30 Days"]].map(([v,lbl]) => (
                <button key={v} className="qa-btn" onClick={()=>setPeriod(v)} style={{ padding:"7px 14px", fontSize:12, background:period===v?"var(--blue)":"transparent", color:period===v?"#fff":"var(--text2)", fontWeight:period===v?800:400, letterSpacing:"0.04em" }}>{lbl}</button>
              ))}
            </div>
            <button className="qa-btn" onClick={()=>setAiOpen(true)} style={{ background:"var(--surface2)", color:"var(--blue)", border:"1px solid var(--blue-brd)", padding:"7px 14px", borderRadius:8, fontSize:12, fontWeight:800, letterSpacing:"0.06em" }}>◈ AI PCR EVAL</button>
            <div style={{ fontFamily:"var(--mono)", fontSize:14, color:"var(--text2)", background:"var(--surface2)", padding:"7px 12px", borderRadius:6, border:"1px solid var(--border)", letterSpacing:"0.06em" }}>{clock}</div>
          </div>
        </div>
      </div>

      {/* ── MAIN CONTENT ───────────────────────────────────── */}
      <div style={{ maxWidth:1400, margin:"0 auto", padding:"22px 24px" }}>

        {/* SUMMARY ROW */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12, marginBottom:24 }}>
          {[
            { label:"Total Runs",       val:filtered.length,  color:"var(--text)",  sub:"in period" },
            { label:"Critical Flags",   val:redInc.length,    color:"#ff4757",      sub:"protocol violations" },
            { label:"Needs Review",     val:yellowInc.length, color:"#ffb700",      sub:"documentation issues" },
            { label:"Compliance Rate",  val:`${compliance}%`, color:"#1fda73",      sub:`${greenInc.length} of ${filtered.length} runs` },
          ].map(s => (
            <div key={s.label} style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10, padding:"16px 20px" }}>
              <div style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.12em", color:"var(--text3)", fontWeight:700, marginBottom:5 }}>{s.label}</div>
              <div style={{ fontFamily:"var(--mono)", fontSize:34, fontWeight:900, color:s.color, lineHeight:1 }}>{s.val}</div>
              <div style={{ fontSize:11, color:"var(--text3)", marginTop:4 }}>{s.sub}</div>
            </div>
          ))}
        </div>

        {/* STATUS BOARD */}
        <div style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.15em", color:"var(--text3)", fontWeight:700, marginBottom:10 }}>▸ SITUATIONAL AWARENESS STATUS BOARD</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:16, marginBottom:30 }}>
          {["red","yellow","green"].map(status => {
            const incs = { red:redInc, yellow:yellowInc, green:greenInc }[status];
            return (
              <StatusColumn
                key={status}
                status={status}
                incidents={incs}
                onOpenList={() => openList(statusTitle[status], `${PERIOD_LABEL[period]} · ${incs.length} incidents`, incs)}
                onOpenItem={inc => openItem(statusTitle[status], `${PERIOD_LABEL[period]} · ${incs.length} incidents`, incs, inc)}
              />
            );
          })}
        </div>

        {/* PROGRAM INTELLIGENCE */}
        <div style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.15em", color:"var(--text3)", fontWeight:700, marginBottom:10 }}>▸ PROGRAM INTELLIGENCE</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12, marginBottom:30 }}>
          {programs.map(p => (
            <ProgramTile
              key={p.label}
              label={p.label}
              emoji={p.emoji}
              c={cnt(p.incs)}
              color={p.color}
              onClick={() => openList(p.label, `${PERIOD_LABEL[period]} · ${p.incs.length} incident${p.incs.length!==1?"s":""}`, p.incs)}
            />
          ))}
        </div>

        {/* OPERATIONAL BREAKDOWNS */}
        <div style={{ fontSize:10, textTransform:"uppercase", letterSpacing:"0.15em", color:"var(--text3)", fontWeight:700, marginBottom:10 }}>▸ OPERATIONAL BREAKDOWNS</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 }}>

          {/* Shift */}
          <div className="tile" onClick={() => openList("Runs by Shift", `${PERIOD_LABEL[period]} · A/B/C breakdown`, filtered, "shift")} style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10, padding:"16px 18px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12 }}>
              <div>
                <div style={{ fontSize:22, marginBottom:5 }}>🔁</div>
                <div style={{ fontSize:13, fontWeight:700, color:"var(--text)" }}>Runs by Shift</div>
                <div style={{ fontSize:11, color:"var(--text3)", marginTop:2 }}>A / B / C breakdown with chart</div>
              </div>
              <span style={{ fontFamily:"var(--mono)", fontSize:32, fontWeight:900, color:"var(--blue)", lineHeight:1 }}>{filtered.length}</span>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8 }}>
              {["A","B","C"].map(sh => {
                const n = filtered.filter(i=>i.shift===sh).length;
                return (
                  <div key={sh} style={{ background:"var(--surface2)", borderRadius:6, padding:"8px", textAlign:"center", border:"1px solid var(--border)" }}>
                    <div style={{ fontFamily:"var(--mono)", fontSize:10, color:"var(--text3)", marginBottom:2 }}>SH {sh}</div>
                    <div style={{ fontFamily:"var(--mono)", fontSize:20, fontWeight:700, color:"var(--text)" }}>{n}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Providers */}
          <div className="tile" onClick={() => openList("Provider Breakdown", `${PERIOD_LABEL[period]} · personnel compliance`, filtered, "provider")} style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10, padding:"16px 18px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12 }}>
              <div>
                <div style={{ fontSize:22, marginBottom:5 }}>👥</div>
                <div style={{ fontSize:13, fontWeight:700, color:"var(--text)" }}>Provider Breakdown</div>
                <div style={{ fontSize:11, color:"var(--text3)", marginTop:2 }}>All 160 personnel tracked</div>
              </div>
              <span style={{ fontFamily:"var(--mono)", fontSize:32, fontWeight:900, color:"var(--blue)", lineHeight:1 }}>{providerSet.size}</span>
            </div>
            <div style={{ fontSize:12, color:"var(--text2)", lineHeight:1.6 }}>
              Compliance rates, run counts, and QA flags per provider — click to view full breakdown.
            </div>
          </div>

          {/* Units */}
          <div className="tile" onClick={() => openList("Unit Breakdown", `${PERIOD_LABEL[period]} · apparatus compliance`, filtered, "unit")} style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10, padding:"16px 18px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12 }}>
              <div>
                <div style={{ fontSize:22, marginBottom:5 }}>🚒</div>
                <div style={{ fontSize:13, fontWeight:700, color:"var(--text)" }}>Unit Breakdown</div>
                <div style={{ fontSize:11, color:"var(--text3)", marginTop:2 }}>M71–73 · E71–77 · L71–73 · EDO · Staff</div>
              </div>
              <span style={{ fontFamily:"var(--mono)", fontSize:32, fontWeight:900, color:"var(--blue)", lineHeight:1 }}>{unitSet.size}</span>
            </div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
              {[...unitSet].sort().map(u => (
                <span key={u} style={{ background:"var(--surface2)", border:"1px solid var(--border)", borderRadius:4, padding:"2px 7px", fontSize:10, fontFamily:"var(--mono)", color:"var(--text2)" }}>{u}</span>
              ))}
            </div>
          </div>

        </div>

        {/* FOOTER NOTE */}
        <div style={{ marginTop:28, padding:"12px 16px", background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, fontSize:11, color:"var(--text3)", lineHeight:1.7 }}>
          <strong style={{ color:"var(--text2)" }}>Note:</strong> Dashboard uses mock data seeded from ESO PCR template fields.
          Connect live data by replacing the <code style={{ color:"var(--blue)", fontFamily:"var(--mono)" }}>INC</code> array with an ESO API call or Firebase Firestore listener.
          The AI PCR Evaluator references Marion County EMS Protocols 2026 (v25.11.1). All protocol citations should be verified against the current approved document.
        </div>

      </div>

      {/* MODALS */}
      {modal && (
        <IncidentModal
          title={modal.title}
          subtitle={modal.sub}
          incidents={modal.incs}
          view={modal.view}
          initialIncident={modal.init}
          onClose={() => setModal(null)}
        />
      )}
      {aiOpen && <AIEvalPanel onClose={() => setAiOpen(false)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);
  </script>
</body>
</html>
